name: Mise à jour calendrier familial

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le calendrier iCloud
        env:
          ICLOUD_PERSONAL_URL: ${{ secrets.ICLOUD_PERSONAL_URL }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          url = os.environ["ICLOUD_PERSONAL_URL"]

          if url.startswith("webcal://"):
              url = "https://" + url[len("webcal://"):]

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          with open("calendar.ics", "wb") as f:
              f.write(data)

          print("Calendrier iCloud récupéré avec succès.")
          PY

      - name: Enregistrer la mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || git commit -m "Mise à jour calendrier iCloud"
          git push
