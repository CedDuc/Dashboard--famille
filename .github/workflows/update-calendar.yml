name: Mise à jour calendrier familial

on:
  workflow_dispatch:
    inputs:
      courses:
        description: "Liste de courses envoyée par l'iPhone"
        required: false
        type: string
      anniversaires:
        description: "Anniversaires envoyés par l'iPhone"
        required: false
        type: string

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le calendrier iCloud
        env:
          ICLOUD_PERSONAL_URL: ${{ secrets.ICLOUD_PERSONAL_URL }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          url = os.environ["ICLOUD_PERSONAL_URL"]

          if url.startswith("webcal://"):
              url = "https://" + url[len("webcal://"):]

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          with open("calendar.ics", "wb") as f:
              f.write(data)

          print("Calendrier iCloud récupéré avec succès.")
          PY

      - name: Installer le parseur calendrier
        run: |
          python3 -m pip install --quiet icalendar recurring-ical-events

      - name: Préparer les données du dashboard
        env:
          COURSES_INPUT: ${{ inputs.courses }}
          ANNIVERSAIRES_INPUT: ${{ inputs.anniversaires }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo

          from icalendar import Calendar
          import recurring_ical_events

          PARIS = ZoneInfo("Europe/Paris")

          now = datetime.now(PARIS)
          start = datetime.combine(
              now.date(),
              time.min,
              tzinfo=PARIS
          )

          end = start + timedelta(days=8)

          # ==========================================
          # CHARGER LES DONNÉES DÉJÀ EXISTANTES
          # ==========================================

          old_data = {}

          if os.path.exists("dashboard-data.json"):
              try:
                  with open(
                      "dashboard-data.json",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      old_data = json.load(f)
              except Exception:
                  old_data = {}

          # ==========================================
          # CALENDRIER ICLOUD
          # ==========================================

          with open("calendar.ics", "rb") as f:
              cal = Calendar.from_ical(f.read())

          events = []

          for event in recurring_ical_events.of(cal).between(start, end):

              if str(event.get("STATUS", "")).upper() == "CANCELLED":
                  continue

              dtstart = event.decoded("DTSTART")

              dtend = (
                  event.decoded("DTEND")
                  if event.get("DTEND")
                  else None
              )

              all_day = not isinstance(dtstart, datetime)

              if all_day:

                  start_dt = datetime.combine(
                      dtstart,
                      time.min,
                      tzinfo=PARIS
                  )

                  if dtend:
                      end_dt = datetime.combine(
                          dtend,
                          time.min,
                          tzinfo=PARIS
                      )
                  else:
                      end_dt = start_dt + timedelta(days=1)

              else:

                  if dtstart.tzinfo is None:
                      dtstart = dtstart.replace(tzinfo=PARIS)

                  start_dt = dtstart.astimezone(PARIS)

                  if dtend:

                      if dtend.tzinfo is None:
                          dtend = dtend.replace(tzinfo=PARIS)

                      end_dt = dtend.astimezone(PARIS)

                  else:
                      end_dt = start_dt

              events.append({
                  "title": str(event.get("SUMMARY", "Événement")),
                  "location": str(event.get("LOCATION", "")),
                  "start": start_dt.isoformat(),
                  "end": end_dt.isoformat(),
                  "allDay": all_day
              })

          events.sort(key=lambda e: e["start"])

          # ==========================================
          # COURSES
          # ==========================================

          event_name = os.environ.get("EVENT_NAME", "")
          courses_raw = os.environ.get("COURSES_INPUT", "")

          if event_name == "workflow_dispatch":

              courses = [
                  line.strip()
                  for line in courses_raw.splitlines()
                  if line.strip()
              ]

          else:

              courses = old_data.get("courses", [])

          # ==========================================
          # ANNIVERSAIRES
          # ==========================================

          birthdays_raw = os.environ.get(
              "ANNIVERSAIRES_INPUT",
              ""
          )

          if event_name == "workflow_dispatch":

              birthdays = [
                  line.strip()
                  for line in birthdays_raw.splitlines()
                  if line.strip()
              ]

          else:

              birthdays = old_data.get("birthdays", [])

          # ==========================================
          # À RETENIR
          # ==========================================

          keywords_to_ignore = [
              "entraînement",
              "entrainement",
              "football",
              "foot",
              "running"
          ]

          important = []

          for event in events:

              title_lower = event["title"].lower()

              if any(
                  keyword in title_lower
                  for keyword in keywords_to_ignore
              ):
                  continue

              important.append({
                  "title": event["title"],
                  "start": event["start"]
              })

          important = important[:5]

          # ==========================================
          # FICHIER FINAL
          # ==========================================

          output = {
              "generatedAt": now.isoformat(),
              "events": events,
              "courses": courses,
              "birthdays": birthdays,
              "important": important
          }

          with open(
              "dashboard-data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"{len(events)} événement(s)")
          print(f"{len(courses)} course(s)")
          print(f"{len(birthdays)} anniversaire(s)")
          print(f"{len(important)} date(s) importante(s)")

          PY

      - name: Supprimer les fichiers temporaires
        run: |
          rm -f calendar.ics

      - name: Publier les données du dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --ignore-unmatch calendar.ics
          git rm --ignore-unmatch calendar-data.json

          git add dashboard-data.json

          git diff --cached --quiet || git commit -m "Mise à jour données dashboard"
          git push
