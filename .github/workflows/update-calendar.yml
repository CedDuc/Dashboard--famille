name: Mise à jour calendrier familial

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le calendrier iCloud
        env:
          ICLOUD_PERSONAL_URL: ${{ secrets.ICLOUD_PERSONAL_URL }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          url = os.environ["ICLOUD_PERSONAL_URL"]

          if url.startswith("webcal://"):
              url = "https://" + url[len("webcal://"):]

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          with open("calendar.ics", "wb") as f:
              f.write(data)

          print("Calendrier iCloud récupéré avec succès.")
          PY

           - name: Installer le parseur calendrier
        run: |
          python3 -m pip install --quiet icalendar recurring-ical-events

      - name: Préparer les données du dashboard
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo

          from icalendar import Calendar
          import recurring_ical_events

          PARIS = ZoneInfo("Europe/Paris")

          now = datetime.now(PARIS)
          start = datetime.combine(now.date(), time.min, tzinfo=PARIS)
          end = start + timedelta(days=8)

          with open("calendar.ics", "rb") as f:
              cal = Calendar.from_ical(f.read())

          events = []

          for event in recurring_ical_events.of(cal).between(start, end):

              if str(event.get("STATUS", "")).upper() == "CANCELLED":
                  continue

              dtstart = event.decoded("DTSTART")
              dtend = event.decoded("DTEND") if event.get("DTEND") else None

              all_day = not isinstance(dtstart, datetime)

              if all_day:
                  start_dt = datetime.combine(
                      dtstart,
                      time.min,
                      tzinfo=PARIS
                  )

                  if dtend:
                      end_dt = datetime.combine(
                          dtend,
                          time.min,
                          tzinfo=PARIS
                      )
                  else:
                      end_dt = start_dt + timedelta(days=1)

              else:
                  if dtstart.tzinfo is None:
                      dtstart = dtstart.replace(tzinfo=PARIS)

                  start_dt = dtstart.astimezone(PARIS)

                  if dtend:
                      if dtend.tzinfo is None:
                          dtend = dtend.replace(tzinfo=PARIS)

                      end_dt = dtend.astimezone(PARIS)
                  else:
                      end_dt = start_dt

              events.append({
                  "title": str(event.get("SUMMARY", "Événement")),
                  "location": str(event.get("LOCATION", "")),
                  "start": start_dt.isoformat(),
                  "end": end_dt.isoformat(),
                  "allDay": all_day
              })

          events.sort(key=lambda e: e["start"])

          output = {
              "generatedAt": now.isoformat(),
              "events": events
          }

          with open(
              "calendar-data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"{len(events)} événement(s) préparé(s)."
          )
          PY

      - name: Supprimer la copie complète du calendrier
        run: |
          rm -f calendar.ics

      - name: Publier les données utiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm --ignore-unmatch calendar.ics
          git add calendar-data.json

          git diff --cached --quiet || git commit -m "Mise à jour agenda familial"
          git push
