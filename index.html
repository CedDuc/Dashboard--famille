<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Famille</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background:
        linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=85");

    background-size: cover;
    background-position: center;
}

/* HEURE ET DATE */

.clock {
    position: absolute;
    top: 32px;
    left: 38px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.65);
}

#time {
    font-size: 76px;
    font-weight: 300;
    line-height: 1;
}

#date {
    margin-top: 12px;
    font-size: 24px;
    font-weight: 500;
}

/* METEO */

.weather {
    position: absolute;
    top: 30px;
    right: 38px;
    width: 440px;
    text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
}

.weather-main {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 18px;
}

#weather-icon {
    font-size: 64px;
}

#temperature {
    font-size: 72px;
    font-weight: 300;
}

#weather-label {
    font-size: 20px;
    margin-top: 4px;
}

#wind {
    font-size: 17px;
    margin-top: 6px;
}

.forecast {
    margin-top: 24px;
    display: grid;
    gap: 12px;
}

.forecast-day {
    display: grid;
    grid-template-columns: 110px 55px 1fr;
    align-items: center;
    font-size: 20px;
}

.forecast-day .day {
    text-align: left;
    text-transform: uppercase;
}

.forecast-day .icon {
    text-align: center;
    font-size: 29px;
}

.forecast-day .temps {
    text-align: right;
}

#error {
    margin-top: 15px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="clock">
    <div id="time">--:--</div>
    <div id="date">Chargement...</div>
</div>

<div class="weather">
    <div class="weather-main">
        <div id="weather-icon">☀️</div>
        <div>
            <div id="temperature">--°</div>
            <div id="weather-label">Chargement météo...</div>
            <div id="wind"></div>
        </div>
    </div>

    <div class="forecast" id="forecast"></div>
    <div id="error"></div>
</div>

<script>

/* HORLOGE */

function updateClock() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleTimeString("fr-FR", {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("date").textContent =
        now.toLocaleDateString("fr-FR", {
            weekday: "long",
            day: "numeric",
            month: "long"
        });
}

updateClock();
setInterval(updateClock, 1000);


/* ICONES METEO */

function weatherInfo(code) {
    if (code === 0) return ["☀️", "Ensoleillé"];
    if (code === 1) return ["🌤️", "Peu nuageux"];
    if (code === 2) return ["⛅", "Partiellement nuageux"];
    if (code === 3) return ["☁️", "Couvert"];
    if (code === 45 || code === 48) return ["🌫️", "Brouillard"];
    if (code >= 51 && code <= 57) return ["🌦️", "Bruine"];
    if (code >= 61 && code <= 67) return ["🌧️", "Pluie"];
    if (code >= 71 && code <= 77) return ["🌨️", "Neige"];
    if (code >= 80 && code <= 82) return ["🌦️", "Averses"];
    if (code >= 85 && code <= 86) return ["🌨️", "Averses de neige"];
    if (code >= 95) return ["⛈️", "Orage"];

    return ["🌤️", "Variable"];
}


/* METEO CAVAILLON */

async function loadWeather() {

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=43.837&longitude=5.035" +
        "&current=temperature_2m,weather_code,wind_speed_10m" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
        "&timezone=Europe%2FParis" +
        "&forecast_days=4";

    try {

        const response = await fetch(url);
        const data = await response.json();

        const currentInfo = weatherInfo(data.current.weather_code);

        document.getElementById("weather-icon").textContent = currentInfo[0];
        document.getElementById("temperature").textContent =
            Math.round(data.current.temperature_2m) + "°";

        document.getElementById("weather-label").textContent =
            "Cavaillon • " + currentInfo[1];

        document.getElementById("wind").textContent =
            "Vent " + Math.round(data.current.wind_speed_10m) + " km/h";

        const forecast = document.getElementById("forecast");
        forecast.innerHTML = "";

        for (let i = 0; i < data.daily.time.length; i++) {

            const dayDate = new Date(data.daily.time[i] + "T12:00:00");

            const dayName =
                i === 0
                ? "Aujourd’hui"
                : dayDate.toLocaleDateString("fr-FR", {
                    weekday: "short"
                });

            const info = weatherInfo(data.daily.weather_code[i]);

            const row = document.createElement("div");
            row.className = "forecast-day";

            row.innerHTML = `
                <div class="day">${dayName}</div>
                <div class="icon">${info[0]}</div>
                <div class="temps">
                    ${Math.round(data.daily.temperature_2m_max[i])}°
                    /
                    ${Math.round(data.daily.temperature_2m_min[i])}°
                </div>
            `;

            forecast.appendChild(row);
        }

    } catch (e) {

        document.getElementById("weather-label").textContent =
            "Météo indisponible";

        document.getElementById("error").textContent =
            "Nouvelle tentative automatique…";
    }
}

loadWeather();

/* actualisation météo toutes les 15 minutes */
setInterval(loadWeather, 15 * 60 * 1000);

</script>

</body>
</html>
